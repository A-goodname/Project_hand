#             except Exception: pass
#         print("[INFO] 程序已退出", flush=True)
#
# -------------------------------------------------------------
# 禁止事项
# -------------------------------------------------------------
#
#   - 禁止中文全角标点 (。，：（）""；)
#   - 禁止 from xxx import * (通配符导入)
#   - 禁止裸 except (至少 except Exception)
#   - 禁止 Phase 之间共用 pipeline (需独立打开/关闭)
#   - 禁止在 daemon 线程中修改主线程的 GUI (cv2.imshow)
#   - 禁止 import 放在函数体内 (除非有明确理由, 如延迟加载重型依赖)
#
