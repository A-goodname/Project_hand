# =============================================================
# Python 脚本架构模板 (中文注释 + 英文标点规范)
# =============================================================
#
# 文件结构（自上而下）:
#
#   1. # -*- coding: utf-8 -*-
#      文件编码声明，确保中文字符兼容
#
#   2. 项目内容注释 (docstring)
#      格式: 三双引号包裹
#      内容: 模块功能描述、输入/输出、使用说明、架构概览
#      标点: 英文标点 + 中文文字
#
#   3. 包导入
#      顺序: 标准库 → (空行) → 第三方库 → (空行) → 自定义包
#      每个 import 独占一行 (PEP 8)
#      不使用 * 导入
#
#   4. 配置导入
#      从 yaml/json 文件读取配置
#      段首注释: # ---- 加载配置 ----
#      配置变量使用大写或 _cfg 前缀
#
#   5. 辅助函数 (Utility Functions)
#      段首注释: # =============================================================
#                # 辅助函数
#                # =============================================================
#      每个函数包含:
#        - docstring (中文 + 英文标点)
#        - 参数描述 (参数:)
#        - 返回值描述 (返回:)
#      不含 side effect (纯函数)
#
#   6. 功能函数 (Functional Modules)
#       段首注释: # =============================================================
#                 # 功能模块名称
#                 # =============================================================
#       包含:
#         - 类定义 (class) 和/或 函数定义 (def)
#         - 完整 docstring
#         - 类内部的 __init__ 和方法均需 docstring
#
#   7. 主函数 (main)
#       段首注释: # =============================================================
#                 # 主函数
#                 # =============================================================
#       包含:
#         - 入口打印 ========= 分隔线
#         - 明确的步骤注释: # ---- [Step N] 步骤说明 ----
#         - try-except-finally 异常安全清理
#         - if __name__ == "__main__": main()
#
# -------------------------------------------------------------
# 注释规范:
#
#   [段首分隔]
#     # ---- 段落说明 ----
#     用于功能段的首行，如 # ---- 加载配置 ----
#
#   [章节分隔]
#     # =============================================================
#     # 章节标题
#     # =============================================================
#     用于大章节的首尾，如辅助函数、主函数
#
#   [行内注释]
#     # 中文说明 (英文标点)
#     代码右侧或上方，对齐缩进
#
#   [docstring]
#     中文文字 + 英文标点
#     格式: 参数、返回等使用中文 + 英文冒号
#
#   [print/日志标签]
#     [INFO]  - 信息提示
#     [WARN]  - 警告
#     [ERROR] - 错误
#     [DONE]  - 操作完成
#     [SKIP]  - 跳过
#     [ACCEPT]/[REJECT] - 过滤结果
#     标签后跟随中文说明
#
# -------------------------------------------------------------
# 示例文件: python_script_template.py
# 创建日期: 2026-05-22
# =============================================================