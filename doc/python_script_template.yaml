#   [RealSense pipeline 管理]
#     Phase 之间独立 pipeline:
#       Phase 0: rs.pipeline() → start → ... → stop()
#       Phase A-C: RealSenseHandle6DDetector() 打开自己的 pipeline
#     不同 Phase 不同时占用同一物理相机
