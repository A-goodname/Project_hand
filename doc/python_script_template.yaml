# =============================================================
# Python 脚本架构规范 (Project_hand 项目定制)
# =============================================================
#
# 基于项目实际代码模式提炼, 适用于 ESTUN 机械臂 + 灵巧手抓取系统.
#
# -------------------------------------------------------------
# 文件结构 (自上而下)
# -------------------------------------------------------------
#
#   1. # -*- coding: utf-8 -*-
#
#   2. 模块 docstring (三双引号)
#      - 模块功能描述 (一行标题 + ==== 分隔线)
#      - 使用说明 (编号列表: 1. 2. 3.)
#      - 输入 / 输出 (文件列表 + 说明)
#      - 完整流程 (Phase 0 → Phase A → Phase B → Phase C)
#
#   3. 包导入
#      标准库 → 空行 → 第三方库 → 空行 → 自定义包
#      多行导入使用括号换行, 每行一个函数
#
#   4. sys.path 处理
#      _project_root = os.path.dirname(os.path.dirname(os.path.abspath(__file__)))
#      if _project_root not in sys.path: sys.path.insert(0, _project_root)
#
#   5. 全局变量
#      段首注释: # ---- 全局变量 ----
#      模块级变量使用 _ 前缀 (_hand_available, _poses_cleared)
#      threading.Event 用于跨线程停止信号 (stop_event)
#
#   6. 配置加载
#      段首注释: # ---- 加载配置 ----
#      YAML 文件加载 → 提取顶层段 → 展开为模块级常量 (大写)
#      配置不存在时使用 sys.exit(1) 明确退出
#      _cfg 表示原始配置, _cfg_estun 表示子段
#
#   7. 辅助函数
#      章节分隔: # =============================================================
#                # 辅助函数 (纯函数, 无副作用)
#                # =============================================================
#      纯函数: 输入→输出, 不修改全局状态
#      docstring: 中文文字 + 英文标点 (. , : ; ())
#
#   8. 功能类 / 功能函数
#      章节分隔: # =============================================================
#                # 功能模块: 模块名称
#                # =============================================================
#      类: __init__ 参数说明 + 方法 docstring
#      关键模式:
#        - TCP 客户端处理 (handle_client, daemon 线程)
#        - 位姿稳定器 (PoseStabilizer, 代际计数器)
#        - 检测器 (detect + visualize 分离)
#        - 服务器类 (Phase0Server 等)
#
#   9. 主函数 (main)
#      阶段分隔:
#        # ---- [Init N] 初始化说明 ----
#        # ═══ Phase 0 ═══  (可选阶段)
#        # ═══ Phase A-C ═══
#
#      模板:
#        print("=" * 60)
#        print("  标题")
#        print("=" * 60)
#        → [Init 1] → [Init 2] → ... → 主循环
#        → try-except-finally 包裹整个主循环
#        → finally 中依次清理: cv2.destroyAllWindows() → server.close() → pipeline.stop() → disable_hand()
#
#  10. 入口
#      if __name__ == "__main__":
#          main()
#
# -------------------------------------------------------------
# 命名规范
# -------------------------------------------------------------
#
#   模块级私有变量  : _lowercase_with_underscores
#   模块级常量       : UPPERCASE_WITH_UNDERSCORES
#   函数 / 方法     : lowercase_with_underscores
#   类              : PascalCase
#   临时变量        : _unused  (未使用的前缀 _)
#   配置前缀        : _cfg (原始配置), _cfg_estun (子段)
#
# -------------------------------------------------------------
# 标点规范 (严格遵守)
# -------------------------------------------------------------
#
#   句号 `.` 非 `。`    逗号 `,` 非 `，`
#   冒号 `:` 非 `：`    括号 `()` 非 `（）`
#   引号 `""` 非 `""`   分号 `;` 非 `；`
#   所有注释和 docstring 中不得出现中文全角标点
#
# -------------------------------------------------------------
# 打印格式
# -------------------------------------------------------------
#
#   分隔线:
#     print("=" * 60)
#     print("  标题文字")
#     print("=" * 60)
#
#   日志标签:
#     [FATAL] - 致命错误, 程序退出
#     [ERROR] - 错误
#     [WARN]  - 警告
#     [INFO]  - 信息提示
#     [INIT]  - 初始化阶段
#     [Phase N] - 阶段标记 (Phase 0, Phase A, Phase B, Phase C)
#     [TCP]   - TCP 连接事件
#     [RECV]  - 收到数据
#     [SEND]  - 发送数据
#     [CLAMP] - 角度约束修正
#     [STABLE]- 位姿稳定
#     [POUR]  - 倒水相关
#     [HAND]  - 灵巧手操作
#     [压力]   - 压力传感器
#     [DONE]  - 操作完成
#     标签后跟随中文说明
#
#   刷新:
#     关键打印使用 flush=True, 确保机械臂联调时日志实时可见
#
# -------------------------------------------------------------
# 关键代码模式
# -------------------------------------------------------------
#
#   [TCP 非阻塞 accept]
