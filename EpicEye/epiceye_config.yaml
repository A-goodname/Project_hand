# EpicEye 相机配置
camera:
  ip: "192.168.101.66"         # 相机IP，为空字符串时自动搜索
  auto_search: true            # 未指定IP时是否自动搜索

# YOLO 检测模型配置
model:
  path: ../model/yolov8n        # 模型路径（不带 .pt 后缀）
  class_id: 39                   # COCO 水瓶类别 ID
  conf_threshold: 0.5            # 检测置信度阈值
  device: gpu                    # 运行设备: gpu 优先, cpu 强制cpu

# 深度范围配置
depth:
  min: 0.15                      # 深度有效最小值（米）
  max: 1.5                       # 深度有效最大值（米）
  z_threshold: 0.05              # 深度离群过滤阈值（米）

# 时域平滑配置
smoothing:
  alpha: 0.4                     # EMA 平滑系数（0~1），值越小平滑越强

save:
  dir: captures                # 保存目录（相对于 EpicEye/ 目录）

log:
  dir: logs                    # 日志目录（相对于项目根目录）
  level: INFO                  # DEBUG / INFO / WARNING / ERROR