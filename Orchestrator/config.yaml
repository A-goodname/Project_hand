# Orchestrator Handle+Cup 检测器独立配置
# HandleCupDetector 完全由此配置驱动, 不依赖 RealSense_R/config.yaml

# 抓取模式: fixed (基系ABC直用) | vertical | free | dynamic (B2 动态抓取)
orientation_mode: dynamic

# B2 动态抓取: 姿态连续性门禁阈值 (稳定窗口最大测地距离, deg; 超阈禁 arm)
attitude_geodesic_deg: 3.0

# 现场门禁 site_gate (audit 修复 1): 标定后 bind 前只读检查
site_gate:
  preparation_ok: false        # 现场准备确认 (操作员清场后置 true)
  camera_b_id: -1             # -1=按名称搜索；必要时可临时固定 DSHOW 索引
  camera_b_name: UGREEN Camera      # PhaseD 判断相机，Windows 当前索引 3
  camera_b_path: ""           # Linux USB 物理口；Windows 留空
  hand_serial_path: COM4      # VID_0483/PID_5740, S/N 304137433235
  eth_iface: "以太网 5"       # Windows 机械臂有线网卡
  block_link_down: false       # true = 网线断开也阻止启动

# 把手方向
handle_side: right             # 水壶把手方向: right | left (实机: 把手在左)
grasp_direction: right        # 抓取方向: right | left

# 检测间隔 (YOLO kettle + cup 每 N 帧运行一次, 30fps 下 N=3≈10Hz; 2026-08-20 保险: 5→3)
skip_frames: 2

# 位姿稳定器 (PoseStabilizer)
stabilization:
  window: 6                  # 服务器工作区最新实机值: skip=2, window=6, 约 0.4s 收敛
  pos_threshold: 0.01        # 位置波动阈值 (m)
  angle_threshold: 5.0       # 角度波动阈值 (deg, fixed模式下固定波动=0; θ spread 阈值独立=ROT_THETA_SPREAD_MAX 5)

# ---- 模型路径 (相对项目根目录) ----
kettle_model: model/kettle_yolov8n_finetune.pt   # 微调水壶 YOLO
kettle_conf: 0.7                                  # 水壶检测置信度
cup_model: model/yolov8m                          # 水杯 YOLO (class 41)
cup_conf: 0.5                                     # 水杯检测置信度
cup_handle_side: left                             # 杯把手方向: back | left | right
cup_rim_radius: 0.035                             # 杯口半径 (m), 用于 left/right bbox 裁剪
cup_height: 0.100                                 # 杯高先验 (m)
cup_lift_z: 0.05                                  # Cup P3 Z轴抬起高度 (m, 基系)

# ---- YOLO+SAM 把手检测 (红/白胶带辅助已移除) ----
sam_model: model/sam2_b.pt                        # SAM 权重 (相对项目根)
sam_conf: 0.3                                     # SAM 置信度阈值
sam_roi_expand_ratio: 0.3                         # SAM bbox 提示左右扩展比例

# ---- SAM mask 后处理 (质量提升) ----
mask_postprocess:
  erode_kernel: 3           # ERODE 核 (消边界渗漏/噪点; 把手环臂薄, 不宜>5)
  open_kernel: 3            # OPEN 核 (去孤立 speckle)
  close_kernel: 5           # CLOSE 核 (填洞, 与 scanline 内部 close 对齐)
  min_area: 500             # 最大连通域最小面积 (px)
  largest_cc_only: true     # 只保留最大连通域
  retry_raw: true           # 后处理失败 → 原始 mask 重试一次 (防 SAM 孤岛)

# ---- 水平扫描线分离 (把手/壶身, 严格模式) ----
scanline:
  min_ratio: 0.05           # 把手面积/壶身面积 最小比例
  max_ratio: 0.55           # 最大比例
  center_deviation_ratio: 0.25  # X 中心偏差容差 (严格=小值, 保 Y 主轴稳定)
  trim_top: true            # 顶部 X 中心一致性剔除 (双向剔, 弧两端由扩展补回)
  trim_bottom: true         # 底部 X 中心一致性剔除
  use_mask_extent: true     # 搜索范围扩展到 mask 外接矩形 (防 bbox 截断把手)
  extend_px: 0              # 上下扩展行数 — 默认关闭! 扩展 (L 型/补全) 会猜测缺失
                            # 部分并污染 PCA 主轴 (Y 角破坏); 中心由边界偏移法保证

# ---- 姿态稳定 (180° 翻转修复) ----
rot_smooth_alpha: 0.4       # 旋转矩阵 EMA 平滑系数 (矩阵空间平滑, 避万向锁跳变)

# ---- 把手中心模式 ----
handle_pos_mode: mask_center   # mask_center (点云重心, 当前) | edge_offset (边界偏移法, 暂不用)
# edge_offset 边界偏移法曾试用: 固定偏移 (down_cm/in_cm) 相对 mask 尺寸过大
# (4cm 超 mask 高 → 中心到底; 1cm 超 mask 宽 → 中心偏左), 已回退 mask_center

# ---- 诊断 ----
debug:
  save_samples: false       # true=保存 mask/点云样本 (PCA 主方向偏斜排查; 波动分析已用控制台打印)
  save_dir: logs/detector_debug
  save_interval: 30         # 每 N 帧存一次

# ---- 点云采样步长 (性能预算: 反投影为 Python 循环, step↑ 耗时↓) ----
pca_step_handle: 2    # 把手点云采样步长
pca_step_body: 4      # 壶身点云采样步长 (仅 R_ref 建立后计算)

# ---- 深度参数 ----
depth_min: 0.15       # 最小有效深度 (m)
depth_max: 1.5        # 最大有效深度 (m)
depth_z_threshold: 0.05  # 深度离群过滤 (m)

# ---- 固定 ABC (deg, 检测失败时的回落值) ----
handle_euler: [-90, 89, -90]
handle_lift_z: 0.05                                # Handle P3 Z轴抬起高度 (m, 基系)
cup_euler_back: [-90, 89, -110]
cup_euler_left: [-90, 89, -90]

# ---- 旋转角度判定 (方案A宽高比法, 2026-08-18, 2026-08-19 简化 5 档, 2026-08-20 v2 重拟合) ----
# 判档: 反解 θ 区间 5 档 [-30/-15/0/+15/+30] (无 ±45); 负侧/0° 用原始反解 θ
#   band 规则: [-8,8]=0, (8,22]=15, >22=30; 负侧对称 [-22,-8)=-15, <-22→-30, <-40 不可达
#   ★相邻档误判可接受 (用户标准), 无跨档即可
#   θ 反解: θ = φ - arccos((ratio - c0 - c3*(d-d_ref))/A), φ=atan2(c2,c1), A=√(c1²+c2²)
#   v2 模型 (2026-08-20): 区域扩展后 5 档×4 新数据 20 点重拟合, R²=0.974
#   g 校正: 正侧 (θ>8°) 反解受 φ≈28.8° 峰值压缩 (饱和), 用三次多项式校正; 负侧保原始反解 (C 补偿精度)
handle_rotation:
  enabled: true
  global_model:                          # v2 (2026-08-20, 20 点: 5 档×4, 区域扩展后新数据)
    c0: 0.0903
    c1_cos: 0.2052
    c2_sin: 0.1127
    c3_dd: -0.0200
    d_ref: 0.63
  band0_halfwidth: 8.0           # 0° 档判定区间 [-8,8] (2026-08-19: 10→8)
  band15_hi: 22.0                # (8,22]=15, >22=30; 负侧对称 [-22,-8)=-15, <-22→-30 (2026-08-19 用户定案)
  neg_bands: [-30, -15, 0]   # 负半侧档位 (θ 区间映射)
  ratio_max: 0.36                # B2 2026-08-20: 正侧 ratio 上界, 超界 REJECT (防裁切虚高 +45 混入 +30)
                                # 2026-08-20: 0.34→0.36 — 新检测器(区域扩展)合法档 +30° 实测 max 0.3388,
                                # 0.34 会误杀 +30 摆位. 语义更正 (对方 08-20 addendum): 严格 `>0.36` 才
                                # REJECT, 旧裁切高尾 0.34~0.36 与 0.3600 实际通过落 +30, 0.3601 才 REJECT;
                                # +45 主约束是物理摆位限位, 软件不挡 0.34~0.36
  g_correction:                          # (已停用 2026-08-20, 被 pos_side 替代) 正侧三次多项式校正
    enabled: false
    a3: -0.000294
    a2: 0.000812
    a1: 1.315932
    a0: 1.416523
    note: "旧方案: θ_corr=a3θ³+a2θ²+a1θ+a0; +30 解算仍偏低(~22 卡边界), 已弃用"
  pos_side:                               # 正侧连续角度解算 (2026-08-20 v2: 双阈值 + 分段线性)
    enabled: true                         # 仅 θ_raw>8° 正侧应用; 负侧/0° 保持全局模型原始反解
    rd_a: 0.314          # 15 上限: rd ≤ 此 → band 15
    rd_b: 0.320          # 30 下限: rd ≥ 此 → band 30
    rd30: 0.3229         # 30 档节点: rd > 此 → 仿射 (防插值外推)
    k_slope: 50.0        # 30 档仿射斜率 (θ=30+k·(rd−rd30))
    nodes: [[0.2964, 0], [0.3111, 15], [0.3162, 20], [0.3229, 30]]  # 分段线性节点 (rd→角度)
    note: "θ = 分段线性(nodes) 若 rd≤rd30, 否则 30+k(rd−rd30); 中间区 (rd_a<rd<rd_b) 连续解算
           (+20→20°, +22→~23°); 30 节点衔接无跳变; +15 档个别点 (rd 与 +20 重合) 连续漂到 20°"
