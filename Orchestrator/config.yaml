# Orchestrator Handle+Cup 检测器独立配置
# HandleCupDetector 完全由此配置驱动, 不依赖 RealSense_R/config.yaml

# 抓取模式: fixed (基系ABC直用) | vertical | free
orientation_mode: fixed

# 把手方向
handle_side: right             # 水壶把手方向: right | left (实机: 把手在左)
grasp_direction: right        # 抓取方向: right | left

# 检测间隔 (YOLO kettle + cup 每 N 帧运行一次, 30fps 下 N=5≈6Hz)
skip_frames: 5

# 位姿稳定器 (PoseStabilizer)
stabilization:
  window: 3                  # 稳定窗口帧数 (skip_frames=5 → 0.83s)
  pos_threshold: 0.01        # 位置波动阈值 (m)
  angle_threshold: 5.0       # 角度波动阈值 (deg, fixed模式下固定波动=0)

# ---- 模型路径 (相对项目根目录) ----
kettle_model: model/kettle_yolov8n_finetune.pt   # 微调水壶 YOLO
kettle_conf: 0.7                                  # 水壶检测置信度
cup_model: model/yolov8m                          # 水杯 YOLO (class 41)
cup_conf: 0.5                                     # 水杯检测置信度
cup_handle_side: left                             # 杯把手方向: back | left | right
cup_rim_radius: 0.035                             # 杯口半径 (m), 用于 left/right bbox 裁剪
cup_height: 0.100                                 # 杯高先验 (m)
cup_lift_z: 0.05                                  # Cup P3 Z轴抬起高度 (m, 基系)

# ---- YOLO+SAM 把手检测 (红/白胶带辅助已移除) ----
sam_model: model/sam2_b.pt                        # SAM 权重 (相对项目根)
sam_conf: 0.3                                     # SAM 置信度阈值
sam_roi_expand_ratio: 0.3                         # SAM bbox 提示左右扩展比例

# ---- SAM mask 后处理 (质量提升) ----
mask_postprocess:
  erode_kernel: 3           # ERODE 核 (消边界渗漏/噪点; 把手环臂薄, 不宜>5)
  open_kernel: 3            # OPEN 核 (去孤立 speckle)
  close_kernel: 5           # CLOSE 核 (填洞, 与 scanline 内部 close 对齐)
  min_area: 500             # 最大连通域最小面积 (px)
  largest_cc_only: true     # 只保留最大连通域
  retry_raw: true           # 后处理失败 → 原始 mask 重试一次 (防 SAM 孤岛)

# ---- 水平扫描线分离 (把手/壶身, 严格模式) ----
scanline:
  min_ratio: 0.05           # 把手面积/壶身面积 最小比例
  max_ratio: 0.55           # 最大比例
  center_deviation_ratio: 0.25  # X 中心偏差容差 (严格=小值, 保 Y 主轴稳定)
  trim_top: true            # 顶部 X 中心一致性剔除 (双向剔, 弧两端由扩展补回)
  trim_bottom: true         # 底部 X 中心一致性剔除
  use_mask_extent: true     # 搜索范围扩展到 mask 外接矩形 (防 bbox 截断把手)
  extend_px: 50             # 严格剔除后向上/向下扩展行数 (补回把手弧两端, 宁多勿漏)

# ---- 姿态稳定 (180° 翻转修复) ----
rot_smooth_alpha: 0.4       # 旋转矩阵 EMA 平滑系数 (矩阵空间平滑, 避万向锁跳变)

# ---- 把手中心模式 ----
handle_pos_mode: edge_offset   # mask_center (点云重心) | edge_offset (边界偏移法)
edge_offset:
  down_cm: 4.0              # 上边界向下 (cm, 实际距离, 沿相机系图像方向)
  in_cm: 1.0                # 把手侧边界向内 (cm; right→右边界向左, left→左边界向右)

# ---- 点云采样步长 (性能预算: 反投影为 Python 循环, step↑ 耗时↓) ----
pca_step_handle: 2    # 把手点云采样步长
pca_step_body: 4      # 壶身点云采样步长 (仅 R_ref 建立后计算)

# ---- 深度参数 ----
depth_min: 0.15       # 最小有效深度 (m)
depth_max: 1.5        # 最大有效深度 (m)
depth_z_threshold: 0.05  # 深度离群过滤 (m)

# ---- 固定 ABC (deg, 检测失败时的回落值) ----
handle_euler: [-90, 89, -90]
handle_lift_z: 0.05                                # Handle P3 Z轴抬起高度 (m, 基系)
cup_euler_back: [-90, 89, -110]
cup_euler_left: [-90, 89, -90]
