# ESTUN 机器人配置（从 RealSense_R/config.yaml 独立）
# 灵巧手偏移约定：先平移 t_offset，再绕 Z 轴旋转 r_offset.C
# p_gripper = R_z(C)^T @ (p_flange - t_offset)

estun:
  tcp_server:
    host: "192.168.101.2"       # 服务器 IP 地址(本机IP地址)
    port: 8080                   # 服务器端口
  hand:
    port: "COM5"                 # 灵巧手串口号
  calibration:
    result_path: "calib_data/calibration_result.yaml"  # 手眼标定结果(相对项目根目录)
  stabilization:
    window: 3                    # 稳定帧数窗口
    pos_threshold: 0.01          # 位置变化阈值(米)
    angle_threshold: 5.0         # 角度变化阈值(度)

  orientation_mode: "vertical"   # 放置方向修正模式: vertical | horizontal | free | fixed

  # --- fixed 模式: PCA 失效时使用固定姿态 ---
  fixed_abc:
    right: [-90, 82, -98]        # grasp_direction=right 时固定 ABC (deg)
    left:  []                     # 暂未标定, 留空则在 left 时回退到 free

  grasp_direction: "right"       # 抓取方向: right(右手/掌心向左) | left(左手/掌心向右)

  # --- 瓶身灵巧手偏移 (estun_run / estun_epiceye_run / 各 demo 使用) ---
  gripper_offset:
    t_offset: [0.055, -0.045, 0.075]   # C=0(右手大拇指向上)时的标准平移偏移 (x, y, z), 米; 实际运行时根据C动态旋转,考虑从安装位置旋转到C=0时的末端坐标（末端一起旋转）
    r_offset: [0, 0, -90]        # 法兰坐标系下的旋转偏移 (A, B, C), 度; A=B=0, C∈{-90,0,90,180}; 当C = -90时, X增加=灵巧手向下, Y增加=灵巧手向左, Z增加=灵巧手向后

  # --- 把手抓取 (estun_handle_run / estun_handle_demo 使用) ---
  handle_grasp:
    gripper_offset:                    # 把手灵巧手偏移 (独立于瓶身)
      t_handle_offset: [0.06, -0.028, 0.094]   # 抓把手标准平移偏移 (x, y, z), 米; 初始同瓶身, 后续微调
      r_handle_offset: [0, 0, -90]               # 灵巧手安装角度, 同瓶身
      t_tcp_fixed: [0, 0.02, 0.06]             # 末端系下 TCP 固定偏移, 仅用于 P3 倒水位置计算 (不旋转)
    p3_teach_offset:                            # 示教 P3 偏移 (基系, Cup P1 法兰→P3 法兰)
      enable: true                              # 默认启用
      back:                                     # back 模式 (已标定)
        t_offset: [0.0126, -0.1361, 0.2127]   # (x, y, z) m
        r_abc: [-90.0, 30.3, -90.0]            # (A, B, C) deg
      left:                                     # left 模式 (待标定)
        t_offset: [0.0, 0.0, 0.0]              # (x, y, z) m
        r_abc: [0.0, 0.0, 0.0]                 # (A, B, C) deg
    pre_offset:
      t_offset: [0.0, -0.10, 0.03]      # 末端系下预抓取平移偏移 (x, y, z) m
      r_offset: [0.0, 0.0, 0.0]         # 末端系下预抓取旋转偏移 (A, B, C) 度
    target_offset:
      t_offset: [-0.20, 0.04, -0.04]    # 末端系下目标点平移偏移 (x, y, z) m
      r_offset: [0.0, 0.0, -45.0]       # 末端系下目标点旋转偏移 (A, B, C) 度
         

  handle_detection:
    fine_tune_mode: false          # Demo 微调模式: true 时输出位姿后等待手动调整求新偏移

  # --- 水杯检测与抓取 (estun_handle_cup_run / estun_handle_cup_demo / estun_cup_demo 使用) ---
  cup_grasp:
    enabled: true                           # 总开关
    fine_tune_mode: true                   # Demo 微调模式: true 时输出位姿后等待手动调整求新偏移
    spout_offset:                           # [必填] 壶嘴相对把手抓取点的偏移 (倒水用)
      t_offset: [-0.06, 0.17, 0.0]          # (x, y, z) m, 需物理测量后填写
    gripper_offset:                         # 抓水杯的灵巧手偏移
      t_cup_offset: [0.057, -0.010, 0.139] # back 模式偏移 (x, y, z) m, 需微调; 把手在相机对面灵巧手右侧抓取
      t_cup_offset_left: [0.049, -0.070, 0.100] # left 模式偏移 (x, y, z) m, 初始同 back, fine_tune 后独立微调; 把手在相机左侧灵巧手右侧抓取
      r_cup_offset: [0, 0, -90]             # (A, B, C) 度, 灵巧手安装角度
    pre_offset:                             # 末端系下预抓取偏移
      t_offset: [-0.05, 0.0, -0.05]          # (x, y, z) m
      r_offset: [0.0, 0.0, 0.0]             # (A, B, C) 度
    target_offset:                          # 抓杯后目标 (如端给客人)
      t_offset: [-0.2, 0, 0]                # (x, y, z) m
      r_offset: [0.0, 0.0, 0]               # (A, B, C) 度
    pour_offset:                            # [新增] Handle P3 倒水前位置: 壶嘴基系 + 此偏移
      t_offset: [0, 0, 0.05]                # (x, y, z) m, 基系 Z 轴向上 5cm (防碰撞)
      r_offset: [0.0, 0.0, -55.0]           # (A, B, C) 度, 倒水姿态 (同 handle_grasp.target_offset.r_offset)
