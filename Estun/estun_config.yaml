# ESTUN 机器人配置（从 RealSense_R/config.yaml 独立）
# 灵巧手偏移约定：先平移 t_offset，再绕 Z 轴旋转 r_offset.C
# p_gripper = R_z(C)^T @ (p_flange - t_offset)

estun:
  tcp_server:
    host: "192.168.101.96"      # 服务器 IP 地址(本机IP地址, DHCP 动态分配; 机器人端需连此 IP)
    port: 8080                   # 服务器端口
    phase_b_timeout: 60.0        # Phase B 等待稳定位姿超时 (秒)
  # Home 位姿 (mm/deg; 示教工具参考, 与示教器 CRP 同步, 2026-08-17 更新)
  home_pose: [-111.901, 378.274, 698.33, -125.647, 0.759, 4.803]
  hand:
    port: "/dev/serial/by-id/usb-STMicroelectronics_STM32_Virtual_ComPort_304137433235-if00"  # 灵巧手串口 (Linux 稳定路径)
  calibration:
    result_path: "calib_data/calibration_result.yaml"  # 手眼标定结果(相对项目根目录)
  stabilization:
    window: 3                    # 稳定帧数窗口
    pos_threshold: 0.01          # 位置变化阈值(米)
    angle_threshold: 5.0         # 角度变化阈值(度)

  orientation_mode: "vertical"   # 放置方向修正模式: vertical | horizontal | free | fixed

  # --- fixed 模式: PCA 失效时使用固定姿态 ---
  fixed_abc:
    right: [-90, 82, -98]        # grasp_direction=right 时固定 ABC (deg)
    left:  []                     # 暂未标定, 留空则在 left 时回退到 free

  grasp_direction: "right"       # 抓取方向: right(右手/掌心向左) | left(左手/掌心向右)

  # --- 瓶身灵巧手偏移 (RealSense_R: 手动像素映射, 瓶身3D位置更准) ---
  gripper_offset:
    t_offset: [0.055, -0.045, 0.075]   # C=0(右手大拇指向上)时的标准平移偏移 (x, y, z), 米; 实际运行时根据C动态旋转,考虑从安装位置旋转到C=0时的末端坐标（末端一起旋转）
    r_offset: [0, 0, -90]        # 法兰坐标系下的旋转偏移 (A, B, C), 度; A=B=0, C∈{-90,0,90,180}; 当C = -90时, X增加=灵巧手向下, Y增加=灵巧手向左, Z增加=灵巧手向后

  # --- 把手抓取 (RealSense 新版 rs.align: 抓取姿态/旋转更准) ---
  handle_grasp:
    gripper_offset:                    # 把手灵巧手偏移 (独立于瓶身)
      # t_handle_offset: [0.06, -0.028, 0.094]   # RealSense (rs.align)
      # t_handle_offset: [0.04, -0.03, 0.080]     # RealSense_R 历史值 (f2e3579 之前)
      t_handle_offset: [0.048, -0.037, 0.074]   # RealSense_R (手动像素映射); 2026-07-07 fine_tune 实测
      r_handle_offset: [0, 0, -90]               # 灵巧手安装角度, 同瓶身
      t_tcp_fixed: [0, 0.02, 0.06]             # 末端系下 TCP 固定偏移, 仅用于 P3 倒水位置计算 (不旋转)
    p4_definition:                              # [机械臂端] P4 预倒水点定义 (设计草案, 尚未实现)
      status: "待实现 — 需在 CRP 中编码 CposOffset + Y 后退逻辑"
      note: "P4.XYZ = P3.XYZ, P4.ABC = P1.ABC; 倒水 = P4 → P3 仅 B 轴旋转"
      y_backoff:                                # 基系 Y 轴后退量 (防洒水), 按倒水角度索引
        10: 0.100                               # 10° 倒水: Y 后退 100mm (水流近竖直, 壶嘴需离杯更远)
        15: 0.075                               # 15° 倒水: Y 后退 75mm (线性插值)
        20: 0.060                               # 20° 倒水: Y 后退 60mm
        30: 0.050                               # 30° 倒水: Y 后退 50mm (水流有水平分量, 壶嘴可更近)
    p3_teach_offset:                            # 示教 P3 偏移 (基系, Cup P1 法兰→P3 法兰), 按倒水角度索引
      enable: true                              # 默认启用
      pour_angle: 30                            # 当前使用的倒水角度 (B 角度数)
      back:                                     # back 模式 (X-1cm, Z+2cm 基系)
        10:                                     # 10° 倒水
          t_offset: [0.0030, -0.1000, 0.2570]   # (x, y, z) m
          r_abc: [-90.0, 10.3, -90.0]           # (A, B, C) deg
        15:                                     # 15° 倒水
          t_offset: [0.0030, -0.1120, 0.2520]
          r_abc: [-90.0, 15.3, -90.0]
        20:                                     # 20° 倒水
          t_offset: [0.0030, -0.1120, 0.2420]
          r_abc: [-90.0, 20.3, -90.0]
        30:                                     # 30° 倒水 (默认)
          t_offset: [0.0026, -0.1361, 0.2327]
          r_abc: [-90.0, 30.3, -90.0]
      left:                                     # left 模式 (全角度实测: 30°示教, 10°/15°/20° demo校正)
        10:
          t_offset: [-0.0170, -0.0410, 0.2640]
          r_abc: [-90.0, 10.0, -90.0]
        15:
          t_offset: [-0.0171, -0.0620, 0.2593]
          r_abc: [-90.0, 15.3, -90.0]
        20:
          t_offset: [-0.0171, -0.0750, 0.2493]
          r_abc: [-90.0, 20.3, -90.0]
        30:
          t_offset: [0.0786, -0.0094, 0.2536]   # 2026-08-17 重标, 08-18 X+1cm (基系)
          r_abc: [-93.3, 30.5, -5.3]            # 示教固定 ABC (与 P1 不要求一致, 2026-08-17)
    pre_offset:
      t_offset: [0, -0.10, -0.05]      # 末端系下预抓取平移偏移 (x, y, z) m
      r_offset: [0.0, 0.0, 0.0]         # 末端系下预抓取旋转偏移 (A, B, C) 度
    target_offset:
      t_offset: [-0.20, 0.04, -0.04]    # 末端系下目标点平移偏移 (x, y, z) m
      r_offset: [0.0, 0.0, -45.0]       # 末端系下目标点旋转偏移 (A, B, C) 度

  # --- P1 把手抓取示教偏置 (基系直接加, 参考 logs/teach_handle_p1_20260817_150040.log) ---
  # 运行时: P1_base = detect_base + p1_offset (含 TCP 偏移语义, 不再经过 t_handle_effective 补偿)
  # enabled: false 时走旧链 (ee 系减 t_eff + config handle_euler) 做对照
  handle_teach:
    enabled: true                   # P1 落点验证通过后置 true (2026-08-17 实机启用)
    p1_z_check: [0.3599, 0.3629]    # P1 Z 有效范围 (m), 超出打印警告 (2026-08-19 实机标定)
    # 按档位 t_offset 表 (2026-08-19): data_sm 按检测 band 查 p1_offsets.<angle>
    # 0° = 默认/现有 offset (2026-08-17 示教); 其余档位待逐档 teach_P1 --angle <band> --apply 补入
    p1_offsets:
      "0":
        p1_offset: [0.0330, -0.0834, 0.0022]   # 基系: P1 = detect_base + p1_offset (m)
        abc_offset: [-169.2, 76.2, -19.7]      # 基系: P1_ABC = detect_ABC + abc_offset (deg, 动态姿态链备用)
        p1_abc: [-115.2, 85.0, -21.1]          # 示教 ABC (deg)
        p2_offset: [0.0, 0.0, 0.0]             # P2 = P1 + p2_offset
        p2_abc: [-115.2, 85.0, -21.1]          # 通常 = p1_abc
        grasp_offset: [0.0, 0.0, 0.0]          # P1 可选微调 (暂未用)
      "30":
        p1_offset: [-0.0179, -0.0873, -0.0005] # 基系: P1 = detect_base + p1_offset (m) [log 110737, 4次; Z修正已撤回, 0°实测P1 Z=361.4在[359.9,362.9]]
        abc_offset: [-62.6, 100.0, 135.2]      # 基系: P1_ABC = detect_ABC + abc_offset (deg)
        p1_abc: [-115.3, 85.0, -51.1]          # 示教 ABC (deg; C=-51.1 验证 C=C0-θ, A/B 恒定)
        p2_offset: [0.0, 0.0, 0.0]             # P2 = P1 + p2_offset
        p2_abc: [-115.3, 85.0, -51.1]          # 通常 = p1_abc
        grasp_offset: [0.0, 0.0, 0.0]          # P1 可选微调 (暂未用)
      "15":
        p1_offset: [0.0108, -0.0900, 0.0028]   # 基系: P1 = detect_base + p1_offset (m) [log 113226, 4次]
        abc_offset: [-62.9, 101.4, 151.2]      # 基系: P1_ABC = detect_ABC + abc_offset (deg)
        p1_abc: [-115.4, 85.0, -36.3]          # 示教 ABC (deg; C=-36.3, ΔC=-15.2°≈-θ)
        p2_offset: [0.0, 0.0, 0.0]             # P2 = P1 + p2_offset
        p2_abc: [-115.4, 85.0, -36.3]          # 通常 = p1_abc
        grasp_offset: [0.0, 0.0, 0.0]          # P1 可选微调 (暂未用)
      "-30":
        p1_offset: [0.0829, -0.0476, -0.0050]  # 基系: P1 = detect_base + p1_offset (m) [log 172408, 3次]
        abc_offset: [-62.5, 101.3, -163.8]     # 基系: P1_ABC = detect_ABC + abc_offset (deg)
        p1_abc: [-115.2, 85.0, 9.0]            # 示教 ABC (deg; C=+9.0, ΔC=+30.1°=-θ, 与+30对称)
        p2_offset: [0.0, 0.0, 0.0]             # P2 = P1 + p2_offset
        p2_abc: [-115.2, 85.0, 9.0]            # 通常 = p1_abc
        grasp_offset: [0.0, 0.0, 0.0]          # P1 可选微调 (暂未用)
      "-15":
        p1_offset: [0.0670, -0.0683, -0.0008]  # 基系: P1 = detect_base + p1_offset (m) [log 174102, 3次; 预测X58/Y-65/C-6.1, 实测X67/Y-68/C-6.2]
        abc_offset: [-62.5, 100.6, -179.0]     # 基系: P1_ABC = detect_ABC + abc_offset (deg; C≈±179 环绕)
        p1_abc: [-115.4, 85.0, -6.2]           # 示教 ABC (deg; C=-6.2 与 C=C0-θ 预测-6.1 吻合)
        p2_offset: [0.0, 0.0, 0.0]             # P2 = P1 + p2_offset
        p2_abc: [-115.4, 85.0, -6.2]           # 通常 = p1_abc
        grasp_offset: [0.0, 0.0, 0.0]          # P1 可选微调 (暂未用)
    p1_offset: [0.0330, -0.0834, 0.0022]   # 基系: P1 = detect_base + p1_offset (m) [= p1_offsets.0, 旧链兼容]
    abc_offset: [-169.2, 76.2, -19.7]      # 基系: P1_ABC = detect_ABC + abc_offset (deg, 动态姿态链备用)
    p1_abc: [-115.2, 85.0, -21.1]          # 示教 ABC (deg; enabled 时覆盖 config.yaml handle_euler)
    p2_offset: [0.0, 0.0, 0.0]             # 未示教 P2 → 运行时 P2 = P1 + R_base_fix @ pre_offset
    grasp_offset: [0.0, 0.0, 0.0]          # P1 可选微调 (暂未用)

  # --- 水杯抓取示教偏置 (基系直接加, 参考 logs/teach_cup_20260818_130002.log) ---
  # 运行时: Cup P1_base = detect_cup_base + p1_offset (含灵巧手补偿语义)
  # Cup P3 为示教固定值 (不基于检测), P2 = P1 + p2_offset
  cup_teach:
    enabled: true
    p1_offset: [-0.0226, 0.0021, -0.0078]  # 基系: Cup P1 = detect_cup_base + p1_offset (m)
    p1_abc: [-93.5, 88.9, -3.3]            # 示教 ABC (deg, 固定抓取姿态, cup 无动态 euler)
    p2_offset: [0.0, 0.0, 0.0]             # 未示教 P2 → 运行时 P2 = Cup P1 + p2_offset
    p3_pose: [-553.204, -11.067, 479.813, -91.858, 88.943, 66.035]  # 固定 P3 (mm/deg)

  handle_detection:
    fine_tune_mode: true           # Demo 微调模式: true 时输出位姿后等待手动调整求新偏移

  # --- 水杯检测与抓取 (RealSense 新版 rs.align: 水杯检测/抓取更准) ---
  cup_grasp:
    enabled: true                           # 总开关
    fine_tune_mode: true                   # Demo 微调模式: true 时输出位姿后等待手动调整求新偏移
    spout_offset:                           # [必填] 壶嘴相对把手抓取点的偏移 (倒水用)
      t_offset: [-0.06, 0.17, 0.0]          # (x, y, z) m, 需物理测量后填写
    gripper_offset:                         # 抓水杯的灵巧手偏移
      # t_cup_offset: [0.057, -0.010, 0.139] # back 模式偏移 (x, y, z) m, RealSense (rs.align)
      t_cup_offset: [0.051, -0.008, 0.104] # back 模式偏移 (x, y, z) m, RealSense_R (手动像素映射); 2026-07-13 fine_tune 实测
      # t_cup_offset_left: [0.049, -0.070, 0.100] # left 模式偏移 (x, y, z) m, RealSense (rs.align)
      t_cup_offset_left: [0.048, -0.050, 0.082] # left 模式偏移 (x, y, z) m, RealSense_R (手动像素映射); 2026-07-13 fine_tune 实测
      r_cup_offset: [0, 0, -90]             # (A, B, C) 度, 灵巧手安装角度
    pre_offset:                             # 末端系下预抓取偏移
      t_offset: [-0.05, 0.0, -0.05]          # (x, y, z) m
      r_offset: [0.0, 0.0, 0.0]             # (A, B, C) 度
    target_offset:                          # 抓杯后目标 (如端给客人)
      t_offset: [-0.2, 0, 0]                # (x, y, z) m
      r_offset: [0.0, 0.0, 0]               # (A, B, C) 度
    pour_offset:                            # [新增] Handle P3 倒水前位置: 壶嘴基系 + 此偏移
      t_offset: [0, 0, 0.05]                # (x, y, z) m, 基系 Z 轴向上 5cm (防碰撞)
      r_offset: [0.0, 0.0, -55.0]           # (A, B, C) 度, 倒水姿态 (同 handle_grasp.target_offset.r_offset)
  greeting:                                  # Phase 0 打招呼阶段
    port: 8600                               # Phase 0 TCP 端口
    wave_cycles: 3                           # 挥手循环次数 (Hello_1↔Hello_2)
    wave_interval: 0.45                      # 挥手单帧保持时间 (秒)
    # 握手压力检测
    force_timeout: 30.0                      # 等待抓握超时 (秒)
    force_abs_threshold: 100                 # 压力绝对阈值 (手背触点原始值之和)
    force_delta_threshold: 100               # 压力增量阈值
    force_baseline_samples: 5                # 基线采样次数
    force_poll_interval: 0.15                # 压力轮询间隔 (秒)
    force_release_timeout: 60.0              # 等待松手超时 (秒)
    force_release_delta: 50                  # 松手压力 delta 阈值
    force_release_hold: 2.0                  # 松手稳定保持时间 (秒)
    # 打招呼位姿 (mm, deg) — 同事示教值
    zhaoshou1_pose: [415.3, -19.6, 852.8, -89.0, 1.6, -116.8]
    zhaoshou2_pose: [281.7, 65.0, 928.2, -46.9, -3.1, -118.4]
    woshou_pose:    [633.6, 156.9, 602.4, -173.8, 65.9, 178.4]
