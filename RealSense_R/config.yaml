# RealSense_R 配置文件

model:
  name: "./model/yolov8m"        # YOLO 模型路径(相对项目根目录, 不写 .pt 后缀)
  conf_threshold: 0.5            # 检测置信度阈值
  target_class_id: 39            # COCO 目标类别(39=bottle)
  device: gpu                    # 运行设备: gpu 优先(cuda不可用回退cpu), cpu 强制cpu

depth:
  min: 0.15                      # 最小有效深度(米)
  max: 1.5                       # 最大有效深度(米)
  z_threshold: 0.05              # 深度离群过滤阈值(米)

smoothing:
  alpha: 0.4                     # PositionSmoother 位置 EMA 时域平滑系数
  pose_alpha: 0.3                # PoseSmoother 位姿 EMA 时域平滑系数 (含旋转矩阵)

resolution:
  width: 640                     # 图像宽度
  height: 480                    # 图像高度
  fps: 30                        # 帧率

sam:
  model: "sam2_b.pt"            # SAM 模型: sam_b.pt | mobile_sam.pt | FastSAM-s.pt | sam2_b.pt (相对项目根目录, 含 .pt 后缀)
  conf: 0.3                         # SAM 检测置信度阈值
  device: gpu                       # 运行设备: gpu(优先) | cpu(强制)

yolo_world:
  model: "./model/yolov8m-worldv2.pt"    # YOLO-World 模型路径(相对项目根目录, 含 .pt 后缀)
  conf_threshold: 0.25                   # 检测置信度阈值
  classes: ["kettle", "electric kettle", "water jug", "teapot"]    # 检测词汇表
  device: gpu                            # 运行设备: gpu(优先) | cpu(强制)

kettle_model:
  model: "./model/kettle_yolov8n_finetune.pt"    # 微调水壶模型路径 (含 .pt 后缀)
  conf_threshold: 0.7                             # 检测置信度阈值
  device: gpu                                     # 运行设备: gpu(优先) | cpu(强制)

handle:
  handle_side: "right"          # 把手在哪一侧: "right" / "left"
  handle_min_ratio: 0.03        # 把手占壶身最小面积比 
  handle_max_ratio: 0.40        # 把手占壶身最大面积比 
  roi_expand_ratio: 0.1         # SAM ROI 左右拓展比例(相对 bbox 宽度), 弥补 YOLO 框过紧
  skip_frames: 90              # 跳帧数 (SAM2_b 推理约 3s, 150帧≈5s 检测一次; mobile_SAM 可用 10)
  handle_center_deviation_ratio: 0.1  # 把手 x 中心偏差容差(相对把手宽度比例), 用于切掉底部误检

red_tape:
  enabled: true               # 是否启用红色胶带辅助检测 (总开关)
  min_area: 20                 # 红色区域最小有效面积(像素)

# ---- 水杯检测配置 (test_cup_6D.py 使用) ----
cup:
  model_name: "./model/yolov8m"  # [可选] cup 专用模型路径 (相对项目根目录, 不含 .pt 后缀), 为空时使用 model.name
  enabled: true                  # 是否启用水杯检测
  target_class_id: 41            # COCO类别ID (41=cup)
  conf_threshold: 0.5            # YOLO检测置信度阈值
  height: 0.100                  # [用户必填] 杯高先验 (米), 请用尺测量实际水杯高度
  rim_radius: 0.035              # [用户必填] 杯口半径先验 (米), 请用尺测量实际杯口半径
  rim_offset_ratio: 0.6          # [可调] 倒水时壶嘴偏移杯口中心的比例 (0~1)
  handle_side: "back"            # 把手方向: back(默认,把手背对相机,不修改bbox) | left(把手在左侧) | right(把手在右侧)
  device: gpu                    # 运行设备: gpu(优先) | cpu(强制)

# ESTUN 配置已迁移至 estun_config.yaml（项目根目录）