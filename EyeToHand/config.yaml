model:
  name: ./model/yolov8m
  conf_threshold: 0.5
  target_class_id: 0
  device: gpu
depth:
  min: 0.15
  max: 1.5
resolution:
  width: 640
  height: 480
  fps: 30
smoothing:
  alpha: 0.4
stabilizer:
  window: 10
  pos_thresh: 0.03
delivery:
  X_TEACH: 0.2295
  Y_TEACH: 0.4427
  Z_TEACH: 0.3837
  A_TEACH: 148.79
  B_TEACH: 82.79
  C_TEACH: -113.57
  wait_seconds: 2.0
calibration:
  scale: 1.0
  bias: 0.0
hand_in_cup:
  cup_model: model/yolov8m.pt             # YOLO 杯检测
  hand_model: model/hand_landmarker.task   # MediaPipe Hands 21 landmarks
  conf_threshold: 0.5
  hand_min_detection_conf: 0.5
  hand_min_tracking_conf: 0.5
  required_stable: 5                       # 连续确认帧数
  dist_factor: 1.2
  depth_tolerance: 0.10                    # 深度差阈值 (米)
  bbox_margin: 15                          # bbox 外扩像素 (容差)
  curled_threshold: 25                     # MCP→TIP 距离阈值 (px), <此值=手指弯曲
  curled_min_fingers: 2                    # 至少 N 根手指弯曲才判定为握杯手势
  cup_roi_fallback:
    enabled: true
    x1: 337
    y1: 177
    x2: 367
    y2: 225
