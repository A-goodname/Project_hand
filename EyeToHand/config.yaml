model:
  name: ./model/yolov8m
  conf_threshold: 0.5
  target_class_id: 0
  device: gpu
ugreen:
  camera_id: -1
  camera_path: ""                    # Linux USB 物理口；Windows 留空
  camera_name: UGREEN Camera         # PhaseD 判断相机，Windows 当前索引 3
  width: 640
  height: 480
  fps: 30
chair:
  class_id: 56
  conf_threshold: 0.4
  overlap_threshold: 0.4
  seated_stable_frames: 10
  leave_frames: 45
  only_person_detect: true
  person_stable_frames: 10
delivery:
  X_TEACH: 0.2295
  Y_TEACH: 0.4427
  Z_TEACH: 0.3837
  A_TEACH: 148.79
  B_TEACH: 82.79
  C_TEACH: -113.57
  wait_seconds: 2.0
calibration:
  scale: 1.0
  bias: 0.0
hand_in_cup:
  timeout: 25.0
  cup_model: model/yolov8n.pt
  hand_model: model/hand_landmarker.task
  device: cuda
  conf_threshold: 0.5
  hand_min_detection_conf: 0.5
  hand_min_tracking_conf: 0.5
  required_stable: 5
  dist_factor: 1.2
  bbox_margin: 40
  curled_threshold: 35
  curled_min_fingers: 2
cup_roi_fallback:
  enabled: true
  x1: 315
  y1: 166
  x2: 403
  y2: 258
